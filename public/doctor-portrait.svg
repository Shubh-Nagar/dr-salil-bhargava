      <stop offset="0" stop-color="#0B5D8C" />
      <stop offset="1" stop-color="#0A2540" />
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCFE" />
      <stop offset="1" stop-color="#E1EBF2" />
    </linearGradient>
  </defs>
  <rect width="600" height="720" fill="url(#bg)" />
  <!-- shoulders / white coat -->
  <path d="M300 470 C170 470 120 560 110 720 L490 720 C480 560 430 470 300 470 Z" fill="url(#coat)" />
  <path d="M300 470 L300 720" stroke="#C9D8E3" stroke-width="3" />
