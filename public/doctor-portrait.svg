  <path d="M258 486 C250 560 270 610 300 610 C330 610 350 560 342 486" fill="none" stroke="#0EA5E9" stroke-width="7" stroke-linecap="round" />
  <circle cx="300" cy="628" r="14" fill="none" stroke="#0EA5E9" stroke-width="7" />
  <!-- neck -->
  <rect x="272" y="420" width="56" height="70" rx="24" fill="#D8B58C" />
  <!-- head -->
  <circle cx="300" cy="330" r="112" fill="#E4C29B" />
  <!-- hair -->
  <path d="M196 316 C196 250 250 214 300 214 C350 214 404 250 404 316 C404 300 372 286 300 286 C228 286 196 300 196 316 Z" fill="#4A4A4A" />
  <!-- glasses -->
  <g fill="none" stroke="#33424F" stroke-width="5">
    <circle cx="262" cy="330" r="26" />
    <circle cx="338" cy="330" r="26" />
    <path d="M288 330 h24" />
  </g>
  <text x="300" y="700" font-family="Inter, sans-serif" font-size="20" fill="#0B5D8C" text-anchor="middle" opacity="0.0">Portrait placeholder</text>
</svg>
